<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>滋味轩 · 点餐</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

    :root {
      /* 线上菜单写真主题色（不含字体） */
      --bg: #f4ead8;
      --bg-soft: #efe4d2;
      --card: #f7efdf;
      --paper: #fffbf2;
      --gold: #8f2025;
      --gold-soft: #9f2428;
      --gold-dim: rgba(143, 32, 37, 0.12);
      --gold-line: rgba(126, 89, 61, 0.22);
      --text: #443a35;
      --text-secondary: #5c4a42;
      --muted: #88766b;
      --success: #52734e;
      --danger: #a85a4c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --cart-height: 78px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(143,32,37,0.07), transparent 42%),
        radial-gradient(ellipse at 85% 100%, rgba(60,60,59,0.06), transparent 40%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: calc(var(--cart-height) + var(--safe-bottom) + 72px);
      min-height: 100%;
      -webkit-overflow-scrolling: touch;
    }

    /* Header */
    .header {
      padding: calc(20px + var(--safe-top)) 20px 18px;
      text-align: center;
      border-bottom: 6px solid #73191e;
      background: #9f2428;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    }
    .header h1 {
      font-family: "Noto Serif SC", "STKaiti", "KaiTi", serif;
      font-size: 26px; font-weight: 700;
      letter-spacing: 0.4em; color: #fff9ef;
      text-indent: 0.4em;
    }
    .header .sub {
      margin-top: 6px; font-size: 11px; letter-spacing: 0.25em;
      color: #f7ddc4; font-weight: 300;
    }
    .header .divider {
      width: 48px; height: 1px; background: rgba(255, 240, 216, 0.75);
      margin: 12px auto 0; opacity: 0.9;
    }

    /* Budget */
    .budget-bar {
      margin: 16px 16px 0; padding: 14px 16px;
      background: var(--card); border: 1px solid var(--gold-line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .people-control { display: flex; align-items: center; gap: 12px; }
    .people-control label { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
    .people-control button {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--gold); background: transparent;
      color: var(--gold); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .people-control button:active { background: var(--gold-dim); }
    .people-control .num {
      font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 600;
      min-width: 26px; text-align: center; color: var(--text);
    }
    .budget-info { text-align: right; }
    .budget-info .label { font-size: 11px; color: var(--muted); }
    .budget-info .amount {
      font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 600; color: var(--gold);
    }
    .budget-info .hint { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* Tools row */
    .tools {
      margin: 12px 16px 0; display: flex; flex-direction: column; gap: 10px;
    }
    .tool-row { display: flex; gap: 8px; }
    .btn-tool {
      flex: 1; padding: 11px 8px; background: transparent;
      border: 1px solid var(--gold-line); color: var(--gold);
      font-size: 12px; letter-spacing: 1px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-tool:active, .btn-tool.active {
      background: var(--gold); color: #fff9ef; border-color: var(--gold);
    }
    .tool-hint {
      font-size: 11px; color: var(--muted); line-height: 1.5; min-height: 16px; font-weight: 300;
    }

    /* Taste filters */
    .taste-panel {
      margin: 10px 16px 0; padding: 12px 14px;
      background: var(--paper); border: 1px solid var(--gold-line);
      display: none;
    }
    .taste-panel.show { display: block; }
    .taste-title {
      font-size: 11px; color: var(--gold); letter-spacing: 2px;
      margin-bottom: 10px; font-family: "Noto Serif SC", serif;
    }
    .taste-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .taste-tag {
      padding: 6px 12px; border: 1px solid var(--gold-line);
      font-size: 12px; color: var(--text-secondary); cursor: pointer;
      background: transparent; transition: all 0.15s;
    }
    .taste-tag.on {
      border-color: var(--gold); color: var(--gold); background: var(--gold-dim);
    }

    /* History panel */
    .history-panel {
      margin: 10px 16px 0; padding: 12px 14px;
      background: var(--paper); border: 1px solid var(--gold-line);
      display: none; max-height: 200px; overflow-y: auto;
    }
    .history-panel.show { display: block; }
    .history-item {
      padding: 10px 0; border-bottom: 1px solid rgba(126,89,61,0.12);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-info { flex: 1; min-width: 0; }
    .history-info .h-title { font-size: 13px; color: var(--text); }
    .history-info .h-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .btn-reuse {
      padding: 6px 12px; border: 1px solid var(--gold); background: transparent;
      color: var(--gold); font-size: 11px; cursor: pointer; letter-spacing: 1px; flex-shrink: 0;
    }
    .btn-reuse:active { background: var(--gold); color: #fff9ef; }
    .history-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0; }



    .budget-tip {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(var(--cart-height) + var(--safe-bottom) + 8px);
      z-index: 190;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      border: 1px solid var(--gold-line);
      background: rgba(247, 239, 223, 0.97);
      backdrop-filter: blur(10px);
      color: var(--text-secondary);
      display: none;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px rgba(60, 60, 59, 0.14);
    }
    .budget-tip.show { display: block; }
    .budget-tip.warn {
      border-color: rgba(168, 90, 76, 0.35);
      background: rgba(168, 90, 76, 0.08);
      color: #8a453a;
    }
    .budget-tip.ok {
      border-color: rgba(82, 115, 78, 0.35);
      background: rgba(82, 115, 78, 0.08);
      color: #3f5a3c;
    }
    .budget-tip .tip-action {
      color: var(--gold);
      text-decoration: underline;
      cursor: pointer;
      margin-left: 6px;
    }

    
    /* Selected sticky bar */
    .selected-bar {
      position: sticky;
      top: calc(72px + var(--safe-top));
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      padding: 10px 16px;
      background: rgba(247, 239, 223, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gold-line);
      box-shadow: 0 2px 10px rgba(60, 60, 59, 0.1);
      cursor: pointer;
    }
    .selected-bar.show { display: flex; }
    .selected-bar .sel-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .selected-bar .sel-count {
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .selected-bar .sel-names {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70vw;
    }
    .selected-bar .sel-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .selected-bar .sel-price {
      font-family: "Noto Serif SC", serif;
      font-size: 16px;
      color: var(--gold);
      font-weight: 600;
    }
    .selected-bar .sel-go {
      font-size: 11px;
      color: var(--gold);
      border: 1px solid var(--gold-line);
      padding: 4px 8px;
      letter-spacing: 0.5px;
    }

    /* Search */
    .search-wrap {
      margin: 12px 16px 0;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--card);
      border: 1px solid var(--gold-line);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      letter-spacing: 0.3px;
    }
    .search-wrap input::placeholder {
      color: var(--muted);
      font-weight: 300;
    }
    .search-wrap input:focus {
      border-color: var(--gold);
    }
    .search-wrap .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    .search-wrap .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-wrap.has-value .search-clear {
      display: flex;
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 0; padding: 14px 16px 0; overflow-x: auto;
      scrollbar-width: none; border-bottom: 1px solid var(--gold-line); margin-top: 8px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; padding: 10px 14px 12px; background: transparent; border: none;
      border-bottom: 2px solid transparent; font-size: 13px; color: var(--muted);
      cursor: pointer; letter-spacing: 0.5px;
    }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .note {
      margin: 14px 16px 6px; font-size: 11px; color: var(--muted);
      border-left: 2px solid var(--gold-line); padding: 8px 12px;
      line-height: 1.6; font-weight: 300;
    }

    /* Sections */
    .section { margin: 18px 16px 14px; }
    .section-title {
      font-family: "Noto Serif SC", serif; font-size: 13px; font-weight: 600;
      color: var(--gold); letter-spacing: 3px; margin-bottom: 10px;
      padding-bottom: 8px; border-bottom: 1px solid var(--gold-line);
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::before {
      content: ""; width: 6px; height: 6px; border: 1px solid var(--gold); transform: rotate(45deg);
    }
    .dish {
      padding: 13px 0; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(126,89,61,0.1);
    }
    .dish:last-child { border-bottom: none; }
    .dish.hidden-by-filter { display: none; }
    .dish-info { flex: 1; min-width: 0; padding-right: 10px; }
    .dish-name { font-size: 14px; color: var(--text); letter-spacing: 0.3px; }
    .dish-tags { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
    .dish-tag {
      font-size: 10px; padding: 1px 6px; border: 1px solid var(--gold-line);
      color: var(--muted); letter-spacing: 0.5px;
    }
    .dish-tag.spicy { border-color: #a85a4c; color: #a85a4c; }
    .dish-price {
      font-family: "Noto Serif SC", serif; font-size: 13px; color: var(--gold); margin-top: 3px;
    }
    .dish-price span { font-size: 11px; color: var(--muted); font-family: "Noto Sans SC", sans-serif; }

    .qty-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold-line);
      background: transparent; font-size: 15px; color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .qty-btn.plus { border-color: var(--gold); color: var(--gold); }
    .qty-btn:active { background: var(--gold-dim); }
    .qty-btn:disabled { opacity: 0.25; }
    .qty {
      font-family: "Noto Serif SC", serif; font-size: 14px; font-weight: 600;
      min-width: 18px; text-align: center; color: var(--text);
    }

    /* Cart */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(247, 239, 223, 0.96); backdrop-filter: blur(14px);
      border-top: 1px solid var(--gold-line);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      display: flex; align-items: center; gap: 12px; z-index: 200;
    }
    .cart-summary { flex: 1; }
    .cart-summary .total-line { display: flex; align-items: baseline; gap: 8px; }
    .cart-summary .total-price {
      font-family: "Noto Serif SC", serif; font-size: 22px; font-weight: 600; color: var(--gold);
    }
    .cart-summary .total-price::before { content: "¥"; font-size: 13px; margin-right: 1px; }
    .cart-summary .diff {
      font-size: 11px; padding: 2px 7px; border: 1px solid; letter-spacing: 0.5px;
    }
    .cart-summary .diff.over { border-color: var(--danger); color: var(--danger); }
    .cart-summary .diff.under { border-color: var(--success); color: var(--success); }
    .cart-summary .count { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .btn-order {
      background: var(--gold); color: #fff9ef; border: none;
      padding: 12px 18px; font-size: 13px; font-weight: 500; letter-spacing: 1.5px; cursor: pointer;
    }
    .btn-order:disabled { background: #d7c3a9; color: var(--muted); cursor: not-allowed; }

    /* Modal */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(60, 60, 59, 0.5); z-index: 300;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: #f7efdf; width: 100%; max-width: 500px;
      border-radius: 6px 6px 0 0; border-top: 1px solid var(--gold-line);
      max-height: min(80vh, 100%); overflow-y: auto;
      padding: 22px 18px calc(24px + var(--safe-bottom));
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--gold-line);
    }
    .modal-header h3 {
      font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600;
      color: var(--gold); letter-spacing: 2px;
    }
    .modal-close {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold-line);
      background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
    }
    .order-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(126,89,61,0.1);
      font-size: 13px; color: var(--text-secondary); gap: 8px;
    }
    .order-item-main { flex: 1; display: flex; justify-content: space-between; gap: 10px; }
    .order-item-main span:last-child { font-family: "Noto Serif SC", serif; color: var(--gold); }
    .btn-remove-item {
      padding: 3px 8px; border: 1px solid var(--gold-line); background: transparent;
      color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .order-total {
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gold-line);
      display: flex; justify-content: space-between; font-size: 14px;
    }
    .order-total span:last-child { font-family: "Noto Serif SC", serif; color: var(--gold); font-size: 17px; }
    .copy-area {
      margin-top: 14px; background: var(--paper); border: 1px solid var(--gold-line);
      padding: 12px; font-size: 12px; line-height: 1.7; white-space: pre-wrap;
      color: var(--text-secondary); font-weight: 300;
    }
    .btn-copy {
      width: 100%; margin-top: 12px; padding: 13px; background: var(--gold);
      color: #fff9ef; border: none; font-size: 13px; font-weight: 500; letter-spacing: 1.5px; cursor: pointer;
    }
    .empty-tip { text-align: center; color: var(--muted); padding: 24px 0; font-size: 13px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>滋味轩</h1>
    <div class="sub">新中式 · 川味精选</div>
    <div class="divider"></div>
  </div>


  <div class="selected-bar" id="selectedBar">
    <div class="sel-left">
      <div class="sel-count" id="selCount">已选 0 道</div>
      <div class="sel-names" id="selNames"></div>
    </div>
    <div class="sel-right">
      <span class="sel-price" id="selPrice">¥0</span>
      <span class="sel-go">查看</span>
    </div>
  </div>

  <div class="budget-bar">
    <div class="people-control">
      <label>人数</label>
      <button id="minusPeople">−</button>
      <span class="num" id="peopleNum">6</span>
      <button id="plusPeople">+</button>
    </div>
    <div class="budget-info">
      <div class="label">点菜预算（17元/人）</div>
      <div class="amount" id="budgetAmount">¥102</div>
      <div class="hint">米饭另计 1元/人</div>
    </div>
  </div>

  <div class="tools">
    <div class="tool-row">
      <button class="btn-tool" id="btnTaste">口味过滤</button>
      <button class="btn-tool" id="btnBlind">盲盒随机</button>
      <button class="btn-tool" id="btnHistory">历史记录</button>
    </div>
    <div class="tool-hint" id="toolHint"></div>
  </div>

  <div class="taste-panel" id="tastePanel">
    <div class="taste-title">选择偏好（可多选）</div>
    <div class="taste-tags" id="tasteTags">
      <button class="taste-tag" data-taste="mild">微辣/不辣</button>
      <button class="taste-tag" data-taste="spicy">中辣以上</button>
      <button class="taste-tag" data-taste="no-cilantro">不吃香菜</button>
      <button class="taste-tag" data-taste="no-onion">少葱</button>
      <button class="taste-tag" data-taste="meat">偏肉</button>
      <button class="taste-tag" data-taste="veg">偏素</button>
    </div>
  </div>

  <div class="history-panel" id="historyPanel">
    <div id="historyList"></div>
  </div>


  <div class="search-wrap" id="searchWrap">
    <span class="search-icon">⌕</span>
    <input type="search" id="searchInput" placeholder="搜索菜名 / 拼音首字母…" autocomplete="off" enterkeyhint="search" />
    <button type="button" class="search-clear" id="searchClear" aria-label="清除">×</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="liangcai">精品凉菜</div>
    <div class="tab" data-cat="xiaochao">家常小炒</div>
    <div class="tab" data-cat="tese">特色推荐</div>
    <div class="tab" data-cat="tang">汤类</div>
    <div class="tab" data-cat="jiushui">酒水</div>
  </div>

  <div class="note">规则：人数×17元点菜，超出现场补齐。10:00–10:30点餐。点完可一键复制发给老板。</div>
  <div id="menuContainer"></div>


  <div class="budget-tip" id="budgetTip"></div>

  <div class="cart-bar">
    <div class="cart-summary">
      <div class="total-line">
        <span class="total-price" id="cartTotal">0</span>
        <span class="diff under hidden" id="diffTag"></span>
      </div>
      <div class="count" id="cartCount">未选择菜品</div>
    </div>
    <button class="btn-order" id="btnOrder" disabled>查看点菜单</button>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-header">
        <h3>点餐清单</h3>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div id="orderList"></div>
      <div class="order-total"><span>菜品合计</span><span id="modalTotal">¥0</span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;" id="modalBudgetTip"></div>
      <div class="copy-area" id="copyText"></div>
      <button class="btn-copy" id="btnCopy">一键复制点菜单</button>
    </div>
  </div>

  <script>
    // 菜品数据 + 口味标签
    const menuData = [
      { id: 1, name: "凉拌猪耳朵", price: 38, cat: "liangcai", tastes: ["mild","meat"] },
      { id: 2, name: "农家拌土鸡", price: 28, cat: "liangcai", tastes: ["mild","meat"] },
      { id: 3, name: "招牌白肉", price: 29, cat: "liangcai", tastes: ["mild","meat"] },

    const PY = {"丁":"d","丝":"s","乌":"w","乐":"l","乡":"x","二":"e","五":"w","仁":"r","仔":"z","保":"b","兔":"t","农":"n","凉":"l","凤":"f","劲":"j","勇":"y","北":"b","卜":"b","卤":"l","口":"k","可":"k","合":"h","吉":"j","味":"w","咸":"x","唯":"w","嘴":"z","回":"h","圆":"y","土":"t","外":"w","大":"d","头":"t","奶":"n","姜":"j","婆":"p","子":"z","宫":"g","家":"j","小":"x","尖":"j","尾":"w","山":"s","川":"c","巴":"b","常":"c","干":"g","庆":"q","怡":"y","拌":"b","招":"z","拱":"g","排":"p","时":"s","旺":"w","星":"x","木":"m","朵":"d","杂":"z","村":"c","杞":"q","条":"t","板":"b","枸":"g","柳":"l","梅":"m","椒":"j","榨":"z","歪":"w","毛":"m","水":"s","汁":"z","汉":"h","江":"j","汤":"t","沸":"f","油":"y","泉":"q","泡":"p","泥":"n","渣":"z","源":"y","溜":"l","滋":"z","火":"h","灼":"z","炒":"c","烟":"y","烤":"k","烧":"s","煎":"j","煮":"z","煸":"b","爆":"b","爽":"s","片":"p","牌":"p","牛":"n","猪":"z","玉":"y","王":"w","瓜":"g","瓣":"b","生":"s","番":"f","白":"b","皮":"p","盐":"y","盔":"k","矿":"k","碧":"b","笋":"s","米":"m","粉":"f","粑":"b","粮":"l","糍":"c","糖":"t","紫":"z","红":"h","纯":"c","罐":"g","老":"l","耳":"e","肉":"r","肚":"d","肝":"g","肠":"c","肥":"f","腊":"l","腐":"f","腰":"y","腾":"t","花":"h","芹":"q","茄":"j","药":"y","莲":"l","菌":"j","菜":"c","萝":"l","葱":"c","蒜":"s","蔬":"s","虎":"h","虾":"x","蛋":"d","血":"x","豆":"d","辣":"l","边":"b","过":"g","郎":"l","酒":"j","酥":"s","酱":"j","酸":"s","重":"z","野":"y","钵":"b","铁":"t","锅":"g","闯":"c","雪":"x","青":"q","须":"x","饺":"j","香":"x","驴":"l","骨":"g","鱼":"y","鱿":"y","鲜":"x","鸡":"j","鸭":"y","黄":"h","黑":"h"};
    function getInitials(name) {
      let s = "";
      for (const ch of name) {
        if (PY[ch]) s += PY[ch];
        else if (/[a-zA-Z0-9]/.test(ch)) s += ch.toLowerCase();
      }
      return s;
    }

    function matchTaste(dish) {
      if (activeTastes.size === 0) return true;
      const t = dish.tastes || [];
      if (activeTastes.has("mild") && !t.includes("mild")) return false;
      if (activeTastes.has("spicy") && !t.includes("spicy")) return false;
      if (activeTastes.has("meat") && !t.includes("meat")) return false;
      if (activeTastes.has("veg") && !t.includes("veg")) return false;
      if (activeTastes.has("no-cilantro")) { /* 当前数据无香菜标记，默认通过 */ }
      if (activeTastes.has("no-onion") && !t.includes("no-onion") && t.includes("meat")) {
        // 简化：有 no-onion 标签的优先，其余不强制隐藏
      }
      // 多选取交集逻辑：只要满足任一已选偏好即可（更宽松好用）
      for (const a of activeTastes) {
        if (a === "no-cilantro" || a === "no-onion") continue;
        if (t.includes(a)) return true;
      }
      // 如果只选了忌口类
      if ([...activeTastes].every(x => x === "no-cilantro" || x === "no-onion")) return true;
      return activeTastes.size === 0;
    }

    function renderMenu(filterCat = "all") {
      menuContainer.innerHTML = "";
      const cats = filterCat === "all" ? ["liangcai","xiaochao","tese","tang","jiushui"] : [filterCat];
      cats.forEach(cat => {
        const dishes = menuData.filter(d => {
          if (d.cat !== cat) return false;
          if (!matchTaste(d)) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const hitName = d.name.includes(searchQuery);
            const hitPy = (d.py || "").includes(q);
            if (!hitName && !hitPy) return false;
          }
          return true;
        });
        if (!dishes.length) return;
        const section = document.createElement("div");
        section.className = "section";
        section.innerHTML = `<div class="section-title">${catNames[cat]}</div>`;
        const list = document.createElement("div");
        dishes.forEach(dish => {
          const qty = cart[dish.id] || 0;
          const unit = dish.unit ? `/${dish.unit}` : "";
          const tags = (dish.tastes || []).filter(t => t === "spicy" || t === "mild").map(t =>
            `<span class="dish-tag ${t === "spicy" ? "spicy" : ""}">${t === "spicy" ? "辣" : "清淡"}</span>`
          ).join("");
          const div = document.createElement("div");
          div.className = "dish";
          div.innerHTML = `
            <div class="dish-info">
              <div class="dish-name">${dish.name}</div>
              <div class="dish-tags">${tags}</div>
              <div class="dish-price">¥${dish.price}<span>${unit}</span></div>
            </div>
            <div class="qty-control">
              <button class="qty-btn" data-id="${dish.id}" data-act="minus" ${qty===0?"disabled":""}>−</button>
              <span class="qty">${qty}</span>
              <button class="qty-btn plus" data-id="${dish.id}" data-act="plus">+</button>
            </div>`;
          list.appendChild(div);
        });
        section.appendChild(list);
        menuContainer.appendChild(section);
      });
      if (!menuContainer.children.length) {
        const tip = document.createElement("div");
        tip.className = "empty-tip";
        tip.style.padding = "40px 16px";
        tip.textContent = searchQuery ? `未找到「${searchQuery}」相关菜品` : "暂无符合条件的菜品";
        menuContainer.appendChild(tip);
      }
    }

    function updateCartUI() {
      let total = 0, count = 0;
      Object.entries(cart).forEach(([id, qty]) => {
        if (qty > 0) {
          const d = menuData.find(x => x.id == id);
          total += d.price * qty; count += qty;
        }
      });
      const budget = people * 17;
      cartTotalEl.textContent = total;
      cartCountEl.textContent = count === 0 ? "未选择菜品" : `已选 ${count} 道`;
      const budgetTipEl = $("budgetTip");
      if (count === 0) {
        diffTagEl.classList.add("hidden");
        btnOrder.disabled = true;
        budgetTipEl.className = "budget-tip";
        budgetTipEl.innerHTML = "";
      } else {
        btnOrder.disabled = false;
        const diff = total - budget;
        diffTagEl.classList.remove("hidden");
        if (diff > 0) { diffTagEl.textContent = `超 ¥${diff}`; diffTagEl.className = "diff over"; }
        else if (diff < 0) { diffTagEl.textContent = `余 ¥${-diff}`; diffTagEl.className = "diff under"; }
        else { diffTagEl.textContent = "刚好"; diffTagEl.className = "diff under"; }

        // 预算接近提醒
        budgetTipEl.className = "budget-tip show";
        if (diff === 0) {
          budgetTipEl.classList.add("ok");
          budgetTipEl.innerHTML = "刚好卡在预算线上，可以下单了。";
        } else if (diff > 0 && diff <= 15) {
          budgetTipEl.classList.add("warn");
          budgetTipEl.innerHTML = `略超预算 ¥${diff}，可考虑去掉一道小菜，或现场补差价。`;
        } else if (diff > 15) {
          budgetTipEl.classList.add("warn");
          budgetTipEl.innerHTML = `已超预算 ¥${diff}，建议减少菜品或换更便宜的搭配。`;
        } else if (diff < 0 && diff >= -12) {
          budgetTipEl.classList.add("ok");
          // 推荐一道接近剩余预算的便宜菜
          const remain = -diff;
          const candidates = menuData
            .filter(d => d.cat !== "jiushui" && d.price > 0 && d.price <= remain + 3 && !cart[d.id] && matchTaste(d))
            .sort((a, b) => Math.abs(a.price - remain) - Math.abs(b.price - remain));
          const suggest = candidates[0];
          if (suggest) {
            budgetTipEl.innerHTML = `还差 ¥${remain} 到预算。可以加「${suggest.name}」¥${suggest.price}<span class="tip-action" data-add-id="${suggest.id}">一键加入</span>`;
          } else {
            budgetTipEl.innerHTML = `还差 ¥${remain} 到预算，再挑一道小菜就更合适。`;
          }
        } else if (diff < -12) {
          budgetTipEl.classList.add("ok");
          budgetTipEl.innerHTML = `预算还剩 ¥${-diff}，可以再加 1～2 道菜。`;
        } else {
          budgetTipEl.className = "budget-tip";
          budgetTipEl.innerHTML = "";
        }
      }
    
      // 已选吸顶条
      const selectedBar = $("selectedBar");
      const selCount = $("selCount");
      const selNames = $("selNames");
      const selPrice = $("selPrice");
      if (count === 0) {
        selectedBar.classList.remove("show");
      } else {
        selectedBar.classList.add("show");
        selCount.textContent = `已选 ${count} 道`;
        selPrice.textContent = `¥${total}`;
        const names = Object.entries(cart)
          .filter(([, q]) => q > 0)
          .map(([id, q]) => {
            const d = menuData.find(x => x.id == id);
            return q > 1 ? `${d.name}×${q}` : d.name;
          });
        selNames.textContent = names.join("、");
      }

    }

    // 盲盒随机（预算附近）
    function blindBox() {
      const budget = people * 17;
      const upper = budget + 20;
      const pool = menuData.filter(d =>
        d.cat !== "jiushui" && d.cat !== "tang" && d.price <= 50 && matchTaste(d)
      );
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const picked = [];
      let sum = 0;
      for (const d of pool) {
        if (sum + d.price > upper) continue;
        if (picked.some(p => p.cat === d.cat) && picked.filter(p => p.cat === d.cat).length >= 2) continue;
        picked.push(d);
        sum += d.price;
        if (sum >= budget && picked.length >= Math.max(3, Math.floor(people / 2))) break;
      }
      if (picked.length < 2) {
        toolHint.textContent = "盲盒失败，请放宽口味过滤后再试";
        return;
      }
      cart = {};
      picked.forEach(d => { cart[d.id] = 1; });
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelector('.tab[data-cat="all"]').classList.add("active");
      renderMenu("all");
      updateCartUI();
      toolHint.textContent = `盲盒开出 ${picked.length} 道菜，合计 ¥${sum}`;
    }

    // 历史记录
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch { return []; }
    }
    function saveHistory() {
      const items = Object.entries(cart).filter(([,q]) => q > 0).map(([id, qty]) => {
        const d = menuData.find(x => x.id == id);
        return { id: +id, name: d.name, price: d.price, qty };
      });
      if (!items.length) return;
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);
      const record = {
        id: Date.now(),
        time: new Date().toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }),
        people, total, items
      };
      let list = loadHistory();
      list.unshift(record);
      list = list.slice(0, 8);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    }
    function renderHistory() {
      const list = loadHistory();
      const el = $("historyList");
      if (!list.length) {
        el.innerHTML = '<div class="history-empty">暂无历史记录，点完餐后会自动保存</div>';
        return;
      }
      el.innerHTML = list.map(h => `
        <div class="history-item">
          <div class="history-info">
            <div class="h-title">${h.people}人 · ¥${h.total} · ${h.items.length}道</div>
            <div class="h-meta">${h.time} · ${h.items.slice(0,3).map(i=>i.name).join("、")}${h.items.length>3?"…":""}</div>
          </div>
          <button class="btn-reuse" data-hid="${h.id}">复用</button>
        </div>`).join("");
    }

    // Events
    $("btnTaste").addEventListener("click", () => {
      const show = !tastePanel.classList.contains("show");
      tastePanel.classList.toggle("show", show);
      historyPanel.classList.remove("show");
      $("btnTaste").classList.toggle("active", show);
      $("btnHistory").classList.remove("active");
      toolHint.textContent = show ? "选择偏好后列表会自动过滤" : "";
    });
    $("btnHistory").addEventListener("click", () => {
      const show = !historyPanel.classList.contains("show");
      historyPanel.classList.toggle("show", show);
      tastePanel.classList.remove("show");
      $("btnHistory").classList.toggle("active", show);
      $("btnTaste").classList.remove("active");
      if (show) renderHistory();
      toolHint.textContent = show ? "点击「复用」可一键恢复上次点餐" : "";
    });
    $("btnBlind").addEventListener("click", () => {
      tastePanel.classList.remove("show");
      historyPanel.classList.remove("show");
      $("btnTaste").classList.remove("active");
      $("btnHistory").classList.remove("active");
      blindBox();
    });

    $("tasteTags").addEventListener("click", e => {
      const btn = e.target.closest(".taste-tag");
      if (!btn) return;
      const t = btn.dataset.taste;
      if (activeTastes.has(t)) { activeTastes.delete(t); btn.classList.remove("on"); }
      else { activeTastes.add(t); btn.classList.add("on"); }
      renderMenu(document.querySelector(".tab.active").dataset.cat);
    });

    $("historyList").addEventListener("click", e => {
      const btn = e.target.closest(".btn-reuse");
      if (!btn) return;
      const hid = +btn.dataset.hid;
      const rec = loadHistory().find(h => h.id === hid);
      if (!rec) return;
      cart = {};
      rec.items.forEach(i => { cart[i.id] = i.qty; });
      people = rec.people;
      peopleNumEl.textContent = people;
      budgetAmountEl.textContent = "¥" + people * 17;
      renderMenu("all");
      updateCartUI();
      toolHint.textContent = `已复用 ${rec.time} 的点餐记录`;
      historyPanel.classList.remove("show");
      $("btnHistory").classList.remove("active");
    });

    
    const searchInput = $("searchInput");
    const searchWrap = $("searchWrap");
    const searchClear = $("searchClear");
    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value.trim();
      searchWrap.classList.toggle("has-value", !!searchQuery);
      const activeCat = document.querySelector(".tab.active")?.dataset.cat || "all";
      renderMenu(activeCat);
    });
    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      searchWrap.classList.remove("has-value");
      searchInput.focus();
      const activeCat = document.querySelector(".tab.active")?.dataset.cat || "all";
      renderMenu(activeCat);
    });

    
    
    $("selectedBar").addEventListener("click", () => {
      if (Object.keys(cart).length === 0) return;
      saveHistory();
      renderOrderModal();
      modalMask.classList.add("show");
    });

    document.getElementById("budgetTip").addEventListener("click", e => {
      const t = e.target.closest("[data-add-id]");
      if (!t) return;
      const id = +t.dataset.addId;
      cart[id] = (cart[id] || 0) + 1;
      const activeCat = document.querySelector(".tab.active")?.dataset.cat || "all";
      renderMenu(activeCat);
      updateCartUI();
    });

    $("minusPeople").addEventListener("click", () => {
      if (people > 1) { people--; peopleNumEl.textContent = people; budgetAmountEl.textContent = "¥" + people * 17; updateCartUI(); }
    });
    $("plusPeople").addEventListener("click", () => {
      people++; peopleNumEl.textContent = people; budgetAmountEl.textContent = "¥" + people * 17; updateCartUI();
    });
    $("tabs").addEventListener("click", e => {
      if (!e.target.classList.contains("tab")) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      e.target.classList.add("active");
      renderMenu(e.target.dataset.cat);
    });
    menuContainer.addEventListener("click", e => {
      const btn = e.target.closest(".qty-btn");
      if (!btn) return;
      const id = +btn.dataset.id;
      if (btn.dataset.act === "plus") cart[id] = (cart[id] || 0) + 1;
      else { if (cart[id] > 0) cart[id]--; if (!cart[id]) delete cart[id]; }
      renderMenu(document.querySelector(".tab.active").dataset.cat);
      updateCartUI();
    });

    function renderOrderModal() {
      let total = 0, html = "", lines = [];
      const budget = people * 17;
      Object.entries(cart).forEach(([id, qty]) => {
        if (qty <= 0) return;
        const d = menuData.find(x => x.id == id);
        const sub = d.price * qty; total += sub;
        html += `<div class="order-item"><div class="order-item-main"><span>${d.name} ×${qty}</span><span>¥${sub}</span></div><button class="btn-remove-item" data-remove-id="${d.id}">移除</button></div>`;
        lines.push(`${d.name} ×${qty}  ¥${sub}`);
      });
      orderListEl.innerHTML = html || '<div class="empty-tip">还没有选择菜品</div>';
      modalTotalEl.textContent = "¥" + total;
      const diff = total - budget;
      let tip = `人数：${people}人 · 预算：¥${budget}`;
      if (diff > 0) tip += ` · 超出：¥${diff}`;
      else if (diff < 0) tip += ` · 剩余：¥${-diff}`;
      else tip += ` · 刚好`;
      tip += ` · 米饭：¥${people}`;
      modalBudgetTip.textContent = tip;
      copyTextEl.textContent = `【滋味轩点餐】${people}人\n----------------\n${lines.join("\n")}\n----------------\n菜品合计：¥${total}\n预算标准：¥${budget}（17×${people}）\n${diff>0?"超出：¥"+diff+"（现场补齐）":diff<0?"剩余：¥"+(-diff):"刚好预算"}\n米饭：¥${people}（另计）\n----------------\n请按此菜单准备，谢谢！`;
    }

    btnOrder.addEventListener("click", () => {
      saveHistory();
      renderOrderModal();
      modalMask.classList.add("show");
    });
    orderListEl.addEventListener("click", e => {
      const btn = e.target.closest(".btn-remove-item");
      if (!btn) return;
      delete cart[+btn.dataset.removeId];
      renderMenu(document.querySelector(".tab.active").dataset.cat);
      updateCartUI();
      renderOrderModal();
    });
    $("modalClose").addEventListener("click", () => modalMask.classList.remove("show"));
    modalMask.addEventListener("click", e => { if (e.target === modalMask) modalMask.classList.remove("show"); });
    btnCopy.addEventListener("click", () => {
      const text = copyTextEl.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btnCopy.textContent = "已复制 ✓";
        setTimeout(() => btnCopy.textContent = "一键复制点菜单", 1500);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
        btnCopy.textContent = "已复制 ✓";
        setTimeout(() => btnCopy.textContent = "一键复制点菜单", 1500);
      });
    });

    renderMenu();
    updateCartUI();
  </script>
</body>
</html>
