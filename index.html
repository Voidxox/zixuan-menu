<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>滋味轩川菜馆 · 点餐</title>
  <style>
    :root {
      --primary: #c0392b;
      --primary-dark: #962d22;
      --bg: #f7f3eb;
      --card: #ffffff;
      --text: #2c2c2c;
      --muted: #888;
      --border: #e8e0d5;
      --success: #27ae60;
      --warning: #e67e22;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --cart-height: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: calc(var(--cart-height) + var(--safe-bottom) + 24px);
      min-height: 100%;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: white;
      padding: calc(14px + var(--safe-top)) 16px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(192, 57, 43, 0.3);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header .sub {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 4px;
    }

    /* People & Budget Bar */
    .budget-bar {
      background: white;
      margin: 12px 12px 0;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }

    .people-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .people-control label {
      font-size: 14px;
      color: var(--muted);
    }

    .people-control button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fafafa;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .people-control button:active {
      background: #f0f0f0;
    }

    .people-control .num {
      font-size: 18px;
      font-weight: 700;
      min-width: 28px;
      text-align: center;
    }

    .budget-info {
      text-align: right;
    }

    .budget-info .label {
      font-size: 12px;
      color: var(--muted);
    }

    .budget-info .amount {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .budget-info .hint {
      font-size: 11px;
      color: var(--muted);
    }

    /* Category Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 12px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      z-index: 90;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 20px;
      background: white;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    .tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Menu Sections */
    .section {
      margin: 8px 12px 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 3px solid var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dish-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dish {
      background: white;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      transition: box-shadow 0.2s;
    }

    .dish:active {
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .dish-info {
      flex: 1;
      min-width: 0;
    }

    .dish-name {
      font-size: 15px;
      font-weight: 600;
    }

    .dish-price {
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
      margin-top: 2px;
    }

    .dish-price span {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #f5f5f5;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .qty-btn.plus {
      background: var(--primary);
      color: white;
    }

    .qty-btn:active {
      transform: scale(0.92);
    }

    .qty-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .qty {
      font-size: 16px;
      font-weight: 600;
      min-width: 22px;
      text-align: center;
    }

    /* Bottom Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 200;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      min-height: calc(var(--cart-height) + var(--safe-bottom));
    }

    .cart-summary {
      flex: 1;
    }

    .cart-summary .total-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .cart-summary .total-price {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }

    .cart-summary .total-price::before {
      content: "¥";
      font-size: 14px;
    }

    .cart-summary .diff {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .cart-summary .diff.over {
      background: #fdecea;
      color: var(--primary);
    }

    .cart-summary .diff.under {
      background: #e8f8ef;
      color: var(--success);
    }

    .cart-summary .count {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-order {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-order:active {
      background: var(--primary-dark);
    }

    .btn-order:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      max-height: min(80vh, 100%);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(24px + var(--safe-bottom));
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      font-size: 17px;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      font-size: 18px;
      cursor: pointer;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 14px;
    }

    .order-total {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 2px solid var(--border);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .copy-area {
      margin-top: 16px;
      background: #f9f6f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border);
    }

    .btn-copy {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-copy:active {
      background: var(--primary-dark);
    }

    .empty-tip {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
      font-size: 14px;
    }

    .note {
      margin: 8px 12px 20px;
      font-size: 12px;
      color: var(--muted);
      background: #fff8e8;
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid #f5e6c8;
    }

    .hidden {
      display: none !important;
    }

    /* 推荐套餐 - 视觉布局优化 */
    .package-section {
      margin: 14px 12px 10px;
    }

    .package-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-left: 8px;
      border-left: 3px solid var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .package-title::before {
      content: "🔥";
      font-size: 14px;
    }

    .package-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .package-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .package-card:active {
      transform: scale(0.99);
    }

    .package-card .pkg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px 0;
    }

    .package-card .pkg-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .package-card .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .package-card .tag-people {
      background: #fff0ee;
      color: var(--primary);
    }

    .package-card .tag-value {
      background: #e8f8ef;
      color: var(--success);
    }

    .package-card .tag-meat {
      background: #fff5e6;
      color: #e67e22;
    }

    .package-card .pkg-price-badge {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: white;
      font-size: 15px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(192, 57, 43, 0.25);
    }

    .package-card .pkg-body {
      padding: 10px 14px 14px;
    }

    .package-card .pkg-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .package-card .pkg-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .package-card .pkg-dishes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .package-card .dish-chip {
      background: #f7f3eb;
      border: 1px solid #ebe4d8;
      color: #555;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 16px;
      white-space: nowrap;
    }

    .btn-add-pkg {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-add-pkg::before {
      content: "+";
      font-size: 16px;
      font-weight: 700;
    }

    .btn-add-pkg:active {
      background: var(--primary-dark);
    }

    .btn-add-pkg.added {
      background: var(--success);
    }

    .btn-add-pkg.added::before {
      content: "✓";
    }

    /* ================= 菜单写真风格重排 =================
       只调整视觉层与响应式布局，保留原有 DOM id 和交互事件。 */
    :root {
      --primary: #8f2025;
      --primary-dark: #64151a;
      --bg: #3c3c3b;
      --card: #f7efdf;
      --text: #443a35;
      --muted: #88766b;
      --border: #d7c3a9;
      --paper-line: rgba(126, 89, 61, 0.15);
      --success: #52734e;
      --cart-height: 78px;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.09), transparent 30%),
        radial-gradient(circle at 85% 70%, rgba(0,0,0,.12), transparent 36%),
        var(--bg);
      color: var(--text);
      padding-bottom: calc(var(--cart-height) + var(--safe-bottom) + 20px);
    }

    .header,
    .menu-shell {
      width: min(1240px, 100%);
      margin-left: auto;
      margin-right: auto;
    }

    .header {
      position: relative;
      margin-top: 28px;
      padding: 18px 28px 16px;
      background: #9f2428;
      border-radius: 3px 3px 0 0;
      border-bottom: 10px solid #73191e;
      box-shadow: 0 12px 22px rgba(0,0,0,.18);
      overflow: hidden;
    }

    .header::before,
    .header::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      height: 1px;
      background: rgba(255, 240, 216, .75);
      pointer-events: none;
    }

    .header::before { top: 8px; }
    .header::after { bottom: 4px; }

    .header h1 {
      color: #fff9ef;
      text-align: center;
      font-family: "STKaiti", "KaiTi", "FZKai-Z03", serif;
      font-size: clamp(30px, 5vw, 54px);
      font-weight: 700;
      letter-spacing: .32em;
      line-height: 1.12;
      text-shadow: 0 2px 0 rgba(76, 13, 17, .25);
    }

    .header .sub {
      margin-top: 7px;
      color: #f7ddc4;
      text-align: center;
      font-size: 12px;
      letter-spacing: .18em;
      opacity: .95;
    }

    .menu-head-meta {
      display: flex;
      justify-content: flex-end;
      gap: 18px;
      margin-top: 9px;
      color: #f9e8d5;
      font-size: 11px;
      letter-spacing: .08em;
      opacity: .9;
    }

    .menu-shell {
      position: relative;
      padding: 0 30px 48px;
      background:
        linear-gradient(90deg, transparent 0 14%, rgba(130, 94, 65, .025) 14% 14.5%, transparent 14.5% 100%),
        repeating-linear-gradient(0deg, rgba(124, 89, 58, .025) 0 1px, transparent 1px 5px),
        #f4ead8;
      box-shadow: 0 18px 28px rgba(0,0,0,.2);
    }

    .menu-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      border-left: 1px solid rgba(111, 70, 40, .18);
      border-right: 1px solid rgba(111, 70, 40, .18);
      pointer-events: none;
    }

    .budget-bar {
      margin: 0;
      padding: 16px 0 14px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--paper-line);
      border-radius: 0;
      box-shadow: none;
    }

    .recommend-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 16px 0 12px;
      padding: 12px 14px;
      border: 1px solid #cdb79b;
      border-left: 4px solid var(--primary);
      border-radius: 2px;
      background: rgba(255, 251, 242, .72);
      box-shadow: 0 2px 0 rgba(116, 72, 37, .06);
    }

    .recommend-copy {
      min-width: 0;
    }

    .recommend-title {
      color: var(--primary);
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .recommend-hint {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .btn-recommend {
      flex: 0 0 auto;
      min-width: 144px;
      padding: 11px 16px;
      border: 0;
      border-radius: 2px;
      background: var(--primary);
      color: #fff8ed;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-recommend:active { background: var(--primary-dark); }
    .btn-recommend.done { background: var(--success); }

    .people-control label,
    .budget-info .label,
    .budget-info .hint {
      color: var(--muted);
    }

    .people-control button {
      width: 30px;
      height: 30px;
      border-radius: 2px;
      border: 1px solid #a9907c;
      background: rgba(255,255,255,.2);
      color: var(--primary);
      font-size: 17px;
    }

    .people-control .num {
      color: var(--primary);
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .budget-info .amount {
      color: var(--primary);
      font-family: Georgia, serif;
    }

    .package-section {
      margin: 18px 0 12px;
    }

    .package-title,
    .section-title {
      position: relative;
      border: 0;
      padding: 7px 18px;
      color: #fff8ed;
      background: var(--primary);
      box-shadow: inset 0 0 0 2px rgba(255,239,210,.66), inset 0 0 0 5px var(--primary);
      font-family: "STKaiti", "KaiTi", serif;
      letter-spacing: .1em;
      text-align: center;
    }

    .package-title {
      width: fit-content;
      margin: 0 auto 14px;
      font-size: 19px;
    }

    .package-title::before,
    .package-title::after {
      content: "";
      position: absolute;
      top: 50%;
      width: clamp(38px, 12vw, 170px);
      height: 1px;
      background: rgba(143,32,37,.45);
    }

    .package-title::before { right: 100%; margin-right: 14px; }
    .package-title::after { left: 100%; margin-left: 14px; }

    .package-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .package-card {
      border-radius: 2px;
      border: 1px solid #cdb79b;
      background: rgba(255,251,242,.62);
      box-shadow: 0 2px 0 rgba(116, 72, 37, .08);
    }

    .package-card .pkg-top {
      padding: 10px 12px 0;
    }

    .package-card .pkg-price-badge {
      border-radius: 2px;
      background: var(--primary);
      box-shadow: none;
    }

    .package-card .pkg-body {
      padding: 8px 12px 12px;
    }

    .package-card .pkg-name {
      font-family: "STKaiti", "KaiTi", serif;
      color: var(--primary);
    }

    .package-card .dish-chip {
      border-radius: 2px;
      background: rgba(228, 209, 184, .35);
      border-color: #d8c4aa;
    }

    .btn-add-pkg,
    .btn-copy {
      border-radius: 2px;
      background: var(--primary);
    }

    .tabs {
      position: sticky;
      top: 0;
      margin: 14px -30px 0;
      padding: 12px 30px 10px;
      background: rgba(244,234,216,.95);
      border-top: 1px solid var(--paper-line);
      border-bottom: 1px solid var(--paper-line);
      gap: 10px;
    }

    .tab {
      min-height: 32px;
      padding: 6px 13px;
      border-radius: 2px;
      border: 1px solid #b89a80;
      background: transparent;
      color: var(--text);
      font-size: 13px;
    }

    .tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff7e9;
    }

    .note {
      margin: 12px 0 20px;
      padding: 9px 12px;
      border-radius: 2px;
      border: 1px solid #d8b57e;
      border-left: 4px solid var(--primary);
      background: rgba(255,248,226,.7);
      color: #765c48;
    }

    #menuContainer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 24px;
      align-items: start;
    }

    .section {
      margin: 0;
      padding: 0 12px 10px;
      border-bottom: 1px solid var(--paper-line);
    }

    .section-title {

      { id: 118, name: "红星二锅头", price: 10, cat: "jiushui", unit: "瓶" },
      { id: 119, name: "王老吉", price: 6, cat: "jiushui", unit: "瓶" },
      { id: 120, name: "雪碧罐", price: 4, cat: "jiushui", unit: "瓶" },
      { id: 121, name: "雪花纯生", price: 12, cat: "jiushui", unit: "瓶" },
      { id: 122, name: "雪花勇闯", price: 8, cat: "jiushui", unit: "瓶" },
      { id: 123, name: "矿泉水", price: 2, cat: "jiushui", unit: "瓶" },
    ];

    const catNames = {
      liangcai: "精品凉菜",
      xiaochao: "家常小炒",
      tese: "特色推荐",
      tang: "汤类",
      jiushui: "酒水饮料"
    };

    // ========== 状态 ==========
    let people = 6;
    let cart = {}; // id -> qty

    // ========== DOM ==========
    const peopleNumEl = document.getElementById("peopleNum");
    const budgetAmountEl = document.getElementById("budgetAmount");
    const menuContainer = document.getElementById("menuContainer");
    const cartTotalEl = document.getElementById("cartTotal");
    const cartCountEl = document.getElementById("cartCount");
    const diffTagEl = document.getElementById("diffTag");
    const btnOrder = document.getElementById("btnOrder");
    const modalMask = document.getElementById("modalMask");
    const orderListEl = document.getElementById("orderList");
    const modalTotalEl = document.getElementById("modalTotal");
    const modalBudgetTip = document.getElementById("modalBudgetTip");
    const copyTextEl = document.getElementById("copyText");
    const btnCopy = document.getElementById("btnCopy");
    const btnRecommend = document.getElementById("btnRecommend");
    const recommendHintEl = document.getElementById("recommendHint");

    // ========== 渲染菜单 ==========
    function renderMenu(filterCat = "all") {
      menuContainer.innerHTML = "";
      const cats = filterCat === "all"
        ? ["liangcai", "xiaochao", "tese", "tang", "jiushui"]
        : [filterCat];

      cats.forEach(cat => {
        const dishes = menuData.filter(d => d.cat === cat);
        if (dishes.length === 0) return;

        const section = document.createElement("div");
        section.className = "section";
        section.innerHTML = `<div class="section-title">${catNames[cat]}</div>`;
        const list = document.createElement("div");
        list.className = "dish-list";

        dishes.forEach(dish => {
          const qty = cart[dish.id] || 0;
          const unit = dish.unit ? `/${dish.unit}` : "";
          const div = document.createElement("div");
          div.className = "dish";
          div.innerHTML = `
            <div class="dish-info">
              <div class="dish-name">${dish.name}</div>
              <div class="dish-price">¥${dish.price}<span>${unit}</span></div>
            </div>
            <div class="qty-control">
              <button class="qty-btn" data-id="${dish.id}" data-act="minus" ${qty === 0 ? "disabled" : ""}>−</button>
              <span class="qty">${qty}</span>
              <button class="qty-btn plus" data-id="${dish.id}" data-act="plus">+</button>
            </div>
          `;
          list.appendChild(div);
        });

        section.appendChild(list);
        menuContainer.appendChild(section);
      });
    }

    // ========== 更新购物车显示 ==========
    function updateCartUI() {
      let total = 0;
      let count = 0;
      Object.entries(cart).forEach(([id, qty]) => {
        if (qty > 0) {
          const dish = menuData.find(d => d.id == id);
          total += dish.price * qty;
          count += qty;
        }
      });

      const budget = people * 17;
      cartTotalEl.textContent = total;
      cartCountEl.textContent = count === 0 ? "未选择菜品" : `已选 ${count} 道菜`;

      if (count === 0) {
        diffTagEl.classList.add("hidden");
        btnOrder.disabled = true;
      } else {
        btnOrder.disabled = false;
        const diff = total - budget;
        diffTagEl.classList.remove("hidden");
        if (diff > 0) {
          diffTagEl.textContent = `超预算 ¥${diff}`;
          diffTagEl.className = "diff over";
        } else if (diff < 0) {
          diffTagEl.textContent = `剩余 ¥${-diff}`;
          diffTagEl.className = "diff under";
        } else {
          diffTagEl.textContent = "刚好预算";
          diffTagEl.className = "diff under";
        }
      }
    }

    // ========== 按人数智能推荐 ==========
    // 推荐只从菜品中选择，排除酒水；总价控制在餐标至餐标+1人餐标之间。
    function buildRecommendation() {
      const budget = people * 17;
      const upperLimit = budget + 17;
      const smallGroup = people <= 4;
      const smallGroupStapleIds = new Set([30, 97, 98]);
      const alwaysExcludedIds = new Set([10, 14, 98, 108, 109]);
      const recommendationCats = ["liangcai", "xiaochao", "tese"];
      const catBits = Object.fromEntries(recommendationCats.map((cat, index) => [cat, 1 << index]));
      const dishById = Object.fromEntries(menuData.map(dish => [dish.id, dish]));
      const candidates = menuData
        .filter(dish => dish.cat !== "jiushui"
          && dish.cat !== "tang"
          && dish.price <= upperLimit
          && !alwaysExcludedIds.has(dish.id)
          && (!smallGroup || !smallGroupStapleIds.has(dish.id)));

      // 每次点击先打乱候选顺序，再从接近最优的组合池中随机抽取。
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }

      let states = [{ sum: 0, ids: [], mask: 0, counts: {}, randomness: Math.random(), randomSlot: Math.floor(Math.random() * 4) }];

      const stateScore = state => {
        const categoryCount = Object.keys(state.counts).length;
        const missing = Math.max(0, budget - state.sum);
        const excess = Math.max(0, state.sum - budget);
        const mainValue = state.ids.reduce((sum, id) => {
          const dish = dishById[id];
          return sum + (dish && (dish.cat === "xiaochao" || dish.cat === "tese") && dish.price >= 20 ? dish.price : 0);
        }, 0);
        return (state.sum >= budget ? 1000 : 0)
          + categoryCount * 120
          + mainValue * 5
          - missing * 6
          - excess * 3
          + (state.randomness || 0) * 40;
      };

      candidates.forEach(dish => {
        const additions = [];
        states.forEach(state => {
          const nextSum = state.sum + dish.price;
          if (nextSum > upperLimit) return;
          const maxPerCategory = Math.max(2, Math.ceil(people / 5));
          if ((state.counts[dish.cat] || 0) >= maxPerCategory) return;
          const counts = { ...state.counts };
          counts[dish.cat] = (counts[dish.cat] || 0) + 1;
          additions.push({
            sum: nextSum,
            ids: state.ids.concat(dish.id),
            mask: state.mask | (catBits[dish.cat] || 0),
            counts,
            randomness: Math.random(),
            randomSlot: Math.floor(Math.random() * 4)
          });
        });

        const bestByShape = new Map();
        states.concat(additions).forEach(state => {
          const key = `${state.sum}|${state.mask}|${state.randomSlot}`;
          const current = bestByShape.get(key);
          if (!current || stateScore(state) > stateScore(current)) {
            bestByShape.set(key, state);
          }
        });

        states = [...bestByShape.values()]
          .sort((a, b) => stateScore(b) - stateScore(a))
          .slice(0, 2400);
      });

      const finalScore = state => {
        const categoryCount = Object.keys(state.counts).length;
        const excess = state.sum - budget;
        const mainValue = state.ids.reduce((sum, id) => {
          const dish = dishById[id];
          return sum + (dish && (dish.cat === "xiaochao" || dish.cat === "tese") && dish.price >= 20 ? dish.price : 0);
        }, 0);
        return categoryCount * 160 + mainValue * 12 - excess * 5 + (state.randomness || 0) * 100;
      };

      const valid = states
        .filter(state => state.sum >= budget && state.sum <= upperLimit && state.ids.length > 0)
        .sort((a, b) => finalScore(b) - finalScore(a));
      const fallback = states
        .filter(state => state.ids.length > 0)
        .sort((a, b) => Math.abs(a.sum - budget) - Math.abs(b.sum - budget))[0];
      const randomPool = valid.slice(0, Math.min(100, valid.length));
      const selected = randomPool.length
        ? randomPool[Math.floor(Math.random() * randomPool.length)]
        : fallback || { sum: 0, ids: [], counts: {} };

      return {
        total: selected.sum,
        dishes: selected.ids.map(id => menuData.find(dish => dish.id === id)).filter(Boolean)
      };
    }

    btnRecommend.addEventListener("click", () => {
      const result = buildRecommendation();
      cart = {};
      result.dishes.forEach(dish => { cart[dish.id] = 1; });

      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      document.querySelector('.tab[data-cat="all"]').classList.add("active");
      renderMenu("all");
      updateCartUI();

      const budget = people * 17;
      const diff = result.total - budget;
      recommendHintEl.textContent = `已推荐 ${result.dishes.length} 道菜，合计 ¥${result.total}（餐标 ¥${budget}${diff > 0 ? `，上浮 ¥${diff}` : "，刚好达标"}，优先高价菜补充小菜，已排除汤类、花生米类、水饺及酒水）`;
      btnRecommend.textContent = "已生成推荐 ✓";
      btnRecommend.classList.add("done");
      setTimeout(() => {
        btnRecommend.textContent = "一键推荐菜";
        btnRecommend.classList.remove("done");
      }, 1800);
    });

    // ========== 事件 ==========
    document.getElementById("minusPeople").addEventListener("click", () => {
      if (people > 1) {
        people--;
        peopleNumEl.textContent = people;
        budgetAmountEl.textContent = "¥" + (people * 17);
        updateCartUI();
      }
    });

    document.getElementById("plusPeople").addEventListener("click", () => {
      people++;
      peopleNumEl.textContent = people;
      budgetAmountEl.textContent = "¥" + (people * 17);
      updateCartUI();
    });

    // 分类切换
    document.getElementById("tabs").addEventListener("click", e => {
      if (e.target.classList.contains("tab")) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");
        renderMenu(e.target.dataset.cat);
      }
    });

    // 加减菜
    menuContainer.addEventListener("click", e => {
      const btn = e.target.closest(".qty-btn");
      if (!btn) return;
      const id = +btn.dataset.id;
      const act = btn.dataset.act;
      if (act === "plus") {
        cart[id] = (cart[id] || 0) + 1;
      } else {
        if (cart[id] > 0) cart[id]--;
        if (cart[id] === 0) delete cart[id];
      }
      renderMenu(document.querySelector(".tab.active").dataset.cat);
      updateCartUI();
    });

    // ========== 渲染点餐清单 ==========
    function renderOrderModal() {
      let total = 0;
      let html = "";
      let textLines = [];
      const budget = people * 17;

      Object.entries(cart).forEach(([id, qty]) => {
        if (qty > 0) {
          const dish = menuData.find(d => d.id == id);
          const sub = dish.price * qty;
          total += sub;
          html += `<div class="order-item">
            <div class="order-item-main"><span>${dish.name} ×${qty}</span><span>¥${sub}</span></div>
            <button class="btn-remove-item" data-remove-id="${dish.id}">移除</button>
          </div>`;
          textLines.push(`${dish.name} ×${qty}  ¥${sub}`);
        }
      });

      orderListEl.innerHTML = html || '<div class="empty-tip">还没有选择菜品</div>';
      modalTotalEl.textContent = "¥" + total;

      const diff = total - budget;
      let tip = `人数：${people}人 | 预算：¥${budget}`;
      if (diff > 0) tip += ` | 超出：¥${diff}（现场补齐）`;
      else if (diff < 0) tip += ` | 剩余：¥${-diff}`;
      else tip += ` | 刚好预算`;
      tip += `\n米饭：¥${people}（1元/人，另计）`;
      modalBudgetTip.textContent = tip;

      // 生成可复制文本
      const copyStr = `【滋味轩点餐】${people}人
----------------
${textLines.join("\n")}
----------------
菜品合计：¥${total}
预算标准：¥${budget}（17×${people}）
${diff > 0 ? "超出部分：¥" + diff + "（现场补齐）" : diff < 0 ? "剩余预算：¥" + (-diff) : "刚好预算"}
米饭：¥${people}（另计）
----------------
请按此菜单准备，谢谢！`;
      copyTextEl.textContent = copyStr;
    }

    // 打开点菜单
    btnOrder.addEventListener("click", () => {
      renderOrderModal();
      modalMask.classList.add("show");
    });

    // 在点餐清单中直接移除整道菜
    orderListEl.addEventListener("click", e => {
      const btn = e.target.closest(".btn-remove-item");
      if (!btn) return;
      const id = +btn.dataset.removeId;
      delete cart[id];
      renderMenu(document.querySelector(".tab.active").dataset.cat);
      updateCartUI();
      renderOrderModal();
    });

    document.getElementById("modalClose").addEventListener("click", () => {
      modalMask.classList.remove("show");
    });

    modalMask.addEventListener("click", e => {
      if (e.target === modalMask) modalMask.classList.remove("show");
    });

    btnCopy.addEventListener("click", () => {
      const text = copyTextEl.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btnCopy.textContent = "已复制 ✓";
        setTimeout(() => btnCopy.textContent = "一键复制点菜单", 1500);
      }).catch(() => {
        // fallback
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        btnCopy.textContent = "已复制 ✓";
        setTimeout(() => btnCopy.textContent = "一键复制点菜单", 1500);
      });
    });

    // 初始化
    renderMenu();
    updateCartUI();
  </script>
</body>
</html>
